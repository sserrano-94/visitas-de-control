<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingresar — Control de Visitas</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <h1>🌱 Control de Visitas</h1>
    <p class="subtitle">Ingresa con el correo y clave que te dio Sergio.</p>
    <div class="card">
      <div id="msg"></div>
      <form id="loginForm">
        <div class="form-row">
          <div>
            <label for="email">Correo</label>
            <input type="email" id="email" required autocomplete="username" />
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="password">Clave</label>
            <input type="password" id="password" required autocomplete="current-password" />
          </div>
        </div>
        <button type="submit" style="width:100%;">Ingresar</button>
      </form>
    </div>
    <footer class="hint">¿No tienes cuenta todavía? Pídele a Sergio que te la cree.</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { sb } from './js/supabaseClient.js';

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    // Si ya hay sesión activa, no mostrar el login de nuevo.
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      window.location.href = 'mi-semana.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerHTML = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        msg.innerHTML = `<div class="msg msg-error">No se pudo ingresar: ${error.message}</div>`;
        return;
      }
      window.location.href = 'mi-semana.html';
    });
  </script>
</body>
</html>
