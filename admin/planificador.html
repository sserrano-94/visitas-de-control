<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planificador semanal — Control de Visitas</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="topbar" id="topbar"></div>
  <main>
    <h1>Planificador semanal</h1>
    <p class="subtitle">Arma la semana de cada supervisor. Filtra por supervisor para ver (y poder capturar/enviar) solo su semana.</p>

    <div class="week-nav">
      <button class="secondary" id="prevWeek">← Semana anterior</button>
      <strong id="weekLabel"></strong>
      <button class="secondary" id="nextWeek">Semana siguiente →</button>
    </div>

    <div id="msg"></div>

    <div class="filtro-sup-row" id="filtroSupRow"></div>
    <div class="stats-semana" id="statsSemana"></div>

    <div class="calendario" id="calendario"></div>

    <h2>Agregar visitas a la semana</h2>
    <p class="subtitle" id="hintCandidatos">Los campos sin ninguna visita este mes aparecen marcados como <span class="tag-atrasado">atrasado</span>.</p>
    <div class="form-row" style="max-width:320px;">
      <div><input type="text" id="buscar" placeholder="Buscar por campo, agrícola, zona o comuna…" /></div>
    </div>
    <table id="tablaCampos">
      <thead>
        <tr>
          <th></th><th>Campo</th><th>Zona</th><th>Comuna</th><th>Meta/mes</th><th>Hecho este mes</th><th>Pendiente</th>
          <th>Supervisor</th><th>Día</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div style="margin-top:14px;">
      <button id="btnGuardarSeleccion">Guardar visitas seleccionadas</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { sb } from '../js/supabaseClient.js';
    import { requireAdmin } from '../js/auth.js';
    import { renderTopbar } from '../js/nav.js';
    import { mondayOf, addDays, diasHabiles, nombreDia, fechaCorta, toISODate, rangoSemanaTexto, supervisorClase, escapeHtml } from '../js/helpers.js';

    const profile = await requireAdmin('../mi-semana.html', '../login.html');
    if (!profile) throw new Error('no-admin');
    renderTopbar(profile, '../');

    // Por defecto: la semana siguiente a la actual (el caso de uso más común).
    let monday = addDays(mondayOf(new Date()), 7);

    let supervisores = [];
    let campos = [];
    let hechoPorCampo = {}; // campo_id -> n visitas completadas este mes calendario
    let planSemana = [];    // visitas ya existentes para la semana elegida
    let filtroSupervisorId = null; // null = "Todos"

    document.getElementById('prevWeek').addEventListener('click', () => { monday = addDays(monday, -7); cargarTodo(); });
    document.getElementById('nextWeek').addEventListener('click', () => { monday = addDays(monday, 7); cargarTodo(); });
    document.getElementById('buscar').addEventListener('input', pintarTablaCampos);
    document.getElementById('btnGuardarSeleccion').addEventListener('click', guardarSeleccion);

    async function cargarSupervisores() {
      const { data, error } = await sb.from('profiles').select('id, nombre_completo').eq('activo', true).eq('rol', 'supervisor').order('nombre_completo');
      if (error) { console.error(error); return; }
      supervisores = data || [];
      pintarFiltroSupervisores();
    }

    function pintarFiltroSupervisores() {
      const cont = document.getElementById('filtroSupRow');
      cont.innerHTML = '';
      const btnTodos = document.createElement('button');
      btnTodos.type = 'button';
      btnTodos.className = 'filtro-sup' + (filtroSupervisorId === null ? ' activo' : '');
      btnTodos.style.background = '#374151';
      btnTodos.textContent = 'Todos';
      btnTodos.addEventListener('click', () => { filtroSupervisorId = null; refrescarVista(); });
      cont.appendChild(btnTodos);

      for (const s of supervisores) {
        const btn = document.createElement('button');
        btn.type = 'button';
        const cls = supervisorClase(s.nombre_completo);
        btn.className = 'filtro-sup ' + cls + (filtroSupervisorId === s.id ? ' activo' : '');
        btn.textContent = s.nombre_completo;
        btn.addEventListener('click', () => { filtroSupervisorId = s.id; refrescarVista(); });
        cont.appendChild(btn);
      }
    }

    function refrescarVista() {
      pintarFiltroSupervisores();
      pintarStats();
      pintarCalendario();
      pintarTablaCampos();
    }

    async function cargarCampos() {
      const { data, error } = await sb
        .from('campos')
        .select('id, nombre, zona, comuna, cliente, meta_mensual, supervisor_habitual_id, profiles(nombre_completo)')
        .eq('activo', true)
        .order('zona')
        .order('comuna')
        .order('nombre');
      if (error) { console.error(error); return; }
      campos = data || [];
    }

    async function cargarHechoEsteMes() {
      const hoy = new Date();
      const inicioMes = toISODate(new Date(hoy.getFullYear(), hoy.getMonth(), 1));
      const finMes = toISODate(new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0));
      const { data, error } = await sb
        .from('visitas')
        .select('campo_id')
        .eq('estado', 'completada')
        .gte('fecha_realizada', inicioMes)
        .lte('fecha_realizada', finMes);
      hechoPorCampo = {};
      if (error) { console.error(error); return; }
      for (const v of data || []) {
        hechoPorCampo[v.campo_id] = (hechoPorCampo[v.campo_id] || 0) + 1;
      }
    }

    async function cargarPlanSemana() {
      const friday = addDays(monday, 4);
      const { data, error } = await sb
        .from('visitas')
        .select('id, fecha_planificada, estado, campo_id, supervisor_id, campos(nombre, zona, comuna), profiles!visitas_supervisor_id_fkey(id, nombre_completo)')
        .gte('fecha_planificada', toISODate(monday))
        .lte('fecha_planificada', toISODate(friday))
        .neq('estado', 'cancelada')
        .order('fecha_planificada');
      if (error) { console.error(error); planSemana = []; return; }
      planSemana = data || [];
    }

    function pintarStats() {
      const cont = document.getElementById('statsSemana');
      cont.innerHTML = '';
      for (const s of supervisores) {
        const n = planSemana.filter((v) => v.supervisor_id === s.id).length;
        if (n === 0 && filtroSupervisorId !== null && filtroSupervisorId !== s.id) continue; // no saturar con ceros ajenos al filtro
        const cls = supervisorClase(s.nombre_completo);
        const div = document.createElement('div');
        div.className = 'stat-sup ' + cls;
        div.innerHTML = `<div class="n">${n}</div><div class="lbl">${escapeHtml(s.nombre_completo)} esta semana</div>`;
        cont.appendChild(div);
      }
    }

    function pintarCalendario() {
      const cont = document.getElementById('calendario');
      cont.innerHTML = '';
      const dias = diasHabiles(monday);
      for (const dia of dias) {
        const iso = toISODate(dia);
        const visitasDia = planSemana.filter((v) =>
          v.fecha_planificada === iso && (filtroSupervisorId === null || v.supervisor_id === filtroSupervisorId)
        );
        const col = document.createElement('div');
        col.className = 'calendario-dia';
        col.dataset.fecha = iso;
        col.innerHTML = `<h3>${nombreDia(dia)}</h3><div class="fecha">${fechaCorta(dia)}</div>`;

        // Soltar un chip arrastrado desde otro día → mueve la visita a este día.
        col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drop-target'); });
        col.addEventListener('dragleave', () => col.classList.remove('drop-target'));
        col.addEventListener('drop', (e) => {
          e.preventDefault();
          col.classList.remove('drop-target');
          const visitaId = e.dataTransfer.getData('text/plain');
          if (visitaId) moverVisita(visitaId, iso);
        });

        if (visitasDia.length === 0) {
          col.innerHTML += `<div class="chip-vacio">Sin visitas</div>`;
        } else {
          for (const v of visitasDia) {
            const cls = supervisorClase(v.profiles?.nombre_completo);
            const chip = document.createElement('div');
            chip.className = 'chip ' + cls;
            chip.draggable = true;
            chip.title = 'Arrastra para mover de día';
            chip.addEventListener('dragstart', (e) => {
              e.dataTransfer.setData('text/plain', v.id);
              e.dataTransfer.effectAllowed = 'move';
              chip.classList.add('dragging');
            });
            chip.addEventListener('dragend', () => chip.classList.remove('dragging'));

            const info = document.createElement('div');
            info.className = 'chip-info';
            const campoSpan = document.createElement('span');
            campoSpan.className = 'chip-campo';
            campoSpan.textContent = v.campos?.nombre || '';
            const subSpan = document.createElement('span');
            subSpan.className = 'chip-sub';
            subSpan.textContent = v.campos?.comuna || v.campos?.zona || '';

            const selSupChip = document.createElement('select');
            selSupChip.className = 'chip-sup';
            selSupChip.innerHTML = supervisores.map((s) =>
              `<option value="${s.id}" ${s.id === v.supervisor_id ? 'selected' : ''}>${escapeHtml(s.nombre_completo)}</option>`
            ).join('');
            // Que abrir/usar el select no dispare el drag del chip.
            selSupChip.addEventListener('mousedown', (e) => e.stopPropagation());
            selSupChip.addEventListener('click', (e) => e.stopPropagation());
            selSupChip.addEventListener('change', (e) => cambiarSupervisorChip(v.id, e.target.value));

            info.appendChild(campoSpan);
            info.appendChild(selSupChip);
            info.appendChild(subSpan);

            const btnX = document.createElement('button');
            btnX.type = 'button';
            btnX.className = 'chip-x';
            btnX.title = 'Quitar';
            btnX.textContent = '×';
            btnX.addEventListener('click', () => quitar(v.id));

            chip.appendChild(info);
            chip.appendChild(btnX);
            col.appendChild(chip);
          }
        }
        cont.appendChild(col);
      }
    }

    async function quitar(id) {
      if (!confirm('¿Quitar esta visita planificada?')) return;
      const { error } = await sb.from('visitas').delete().eq('id', id);
      if (error) { alert('Error: ' + error.message); return; }
      await cargarPlanSemana();
      pintarStats();
      pintarCalendario();
      pintarTablaCampos();
    }

    // Arrastrar un chip a otro día: solo cambia fecha_planificada, mantiene supervisor y campo.
    async function moverVisita(id, nuevaFecha) {
      const visita = planSemana.find((v) => v.id === id);
      if (!visita || visita.fecha_planificada === nuevaFecha) return;
      const { error } = await sb.from('visitas').update({ fecha_planificada: nuevaFecha }).eq('id', id);
      if (error) { alert('No se pudo mover la visita: ' + error.message); return; }
      await cargarPlanSemana();
      pintarStats();
      pintarCalendario();
      pintarTablaCampos();
    }

    // Cambiar el supervisor directo desde el chip: el chip recalcula su color solo
    // (pintarCalendario vuelve a leer supervisorClase con el nuevo supervisor_id).
    async function cambiarSupervisorChip(id, nuevoSupervisorId) {
      const { error } = await sb.from('visitas').update({ supervisor_id: nuevoSupervisorId }).eq('id', id);
      if (error) { alert('No se pudo cambiar el supervisor: ' + error.message); return; }
      await cargarPlanSemana();
      pintarStats();
      pintarCalendario();
      pintarTablaCampos();
    }

    function pintarTablaCampos() {
      const filtro = document.getElementById('buscar').value.trim().toLowerCase();
      const dias = diasHabiles(monday);
      const yaPlanificados = new Set(planSemana.map((v) => v.campo_id));

      let filas = campos.filter((c) =>
        !filtro
        || c.nombre.toLowerCase().includes(filtro)
        || (c.zona || '').toLowerCase().includes(filtro)
        || (c.comuna || '').toLowerCase().includes(filtro)
        || (c.cliente || '').toLowerCase().includes(filtro)
      );

      filas = filas.map((c) => {
        const hecho = hechoPorCampo[c.id] || 0;
        const pendiente = (c.meta_mensual || 0) - hecho;
        return { ...c, hecho, pendiente, atrasado: hecho === 0 && (c.meta_mensual || 0) > 0 };
      }).sort((a, b) => {
        // Si hay un supervisor filtrado, sus campos habituales aparecen primero
        // (son las "alternativas" más obvias para asignarle), sin ocultar el resto.
        if (filtroSupervisorId !== null) {
          const aEsSuyo = a.supervisor_habitual_id === filtroSupervisorId;
          const bEsSuyo = b.supervisor_habitual_id === filtroSupervisorId;
          if (aEsSuyo !== bEsSuyo) return aEsSuyo ? -1 : 1;
        }
        if ((a.zona || '') !== (b.zona || '')) return (a.zona || '').localeCompare(b.zona || '');
        if ((a.comuna || '') !== (b.comuna || '')) return (a.comuna || '').localeCompare(b.comuna || '');
        if (a.atrasado !== b.atrasado) return a.atrasado ? -1 : 1;
        return b.pendiente - a.pendiente;
      });

      const tbody = document.querySelector('#tablaCampos tbody');
      tbody.innerHTML = '';
      for (const c of filas) {
        const tr = document.createElement('tr');
        const yaEsta = yaPlanificados.has(c.id);
        tr.innerHTML = `
          <td><input type="checkbox" class="chkCampo" data-id="${c.id}" ${yaEsta ? 'disabled' : ''}/></td>
          <td><strong>${escapeHtml(c.nombre)}</strong>${c.atrasado ? ' <span class="tag-atrasado">atrasado</span>' : ''}${yaEsta ? ' <span class="subtitle" style="font-size:0.78rem;">(ya planificado)</span>' : ''}</td>
          <td>${escapeHtml(c.zona || '')}</td>
          <td>${escapeHtml(c.comuna || '')}</td>
          <td>${c.meta_mensual}</td>
          <td>${c.hecho}</td>
          <td>${c.pendiente > 0 ? c.pendiente : 0}</td>
          <td></td>
          <td></td>`;

        // Supervisor por defecto: si hay un filtro activo, se prioriza ese supervisor
        // (para asignar rápido); si no, el supervisor habitual del campo.
        const supervisorPorDefecto = filtroSupervisorId !== null ? filtroSupervisorId : c.supervisor_habitual_id;

        const tdSup = tr.children[7];
        const selSup = document.createElement('select');
        selSup.className = 'selSup';
        selSup.innerHTML = '<option value="">Elegir…</option>' + supervisores.map(s =>
          `<option value="${s.id}" ${s.id === supervisorPorDefecto ? 'selected' : ''}>${escapeHtml(s.nombre_completo)}</option>`
        ).join('');
        tdSup.appendChild(selSup);

        const tdDia = tr.children[8];
        const selDia = document.createElement('select');
        selDia.className = 'selDia';
        selDia.innerHTML = dias.map(d => `<option value="${toISODate(d)}">${nombreDia(d)} ${fechaCorta(d)}</option>`).join('');
        tdDia.appendChild(selDia);

        tbody.appendChild(tr);
      }
    }

    async function guardarSeleccion() {
      const checks = Array.from(document.querySelectorAll('.chkCampo:checked'));
      if (checks.length === 0) {
        alert('Marca al menos un campo.');
        return;
      }
      const filas = [];
      for (const chk of checks) {
        const tr = chk.closest('tr');
        const supervisorId = tr.querySelector('.selSup').value;
        const dia = tr.querySelector('.selDia').value;
        if (!supervisorId) {
          alert('Falta elegir supervisor en algún campo marcado.');
          return;
        }
        filas.push({
          campo_id: chk.dataset.id,
          supervisor_id: supervisorId,
          fecha_planificada: dia,
          estado: 'planificada',
          creado_por: profile.id,
        });
      }
      const { error } = await sb.from('visitas').insert(filas);
      const msg = document.getElementById('msg');
      if (error) {
        msg.innerHTML = `<div class="msg msg-error">No se pudo guardar: ${error.message}</div>`;
        return;
      }
      msg.innerHTML = `<div class="msg msg-ok">Se agregaron ${filas.length} visita(s) a la semana.</div>`;
      await cargarPlanSemana();
      pintarStats();
      pintarCalendario();
      pintarTablaCampos();
    }

    async function cargarTodo() {
      document.getElementById('weekLabel').textContent = rangoSemanaTexto(monday);
      document.getElementById('msg').innerHTML = '';
      await Promise.all([cargarCampos(), cargarHechoEsteMes(), cargarPlanSemana()]);
      pintarStats();
      pintarCalendario();
      pintarTablaCampos();
    }

    await cargarSupervisores();
    await cargarTodo();
  </script>
</body>
</html>
